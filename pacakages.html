<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP Tourism</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- Banner -->
  <img src="https://www.rajasthantourplanner.com/images/uttar-pradesh-tours.jpg" style="width: 100%; height: 300px;" alt="packages">

  <div class="container my-5">
    <h1 class="text-center mb-4">Find Your Tour</h1>

    <!-- Filters -->
    <div class="d-flex gap-3 mb-4">

      <!-- City Filter -->
      <div class="dropdown">
        <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
          Select City
        </button>
        <ul class="dropdown-menu" id="cityFilter">
          <li><a class="dropdown-item" data-city="All">All</a></li>
          <li><a class="dropdown-item" data-city="Ayodhya">Ayodhya</a></li>
          <li><a class="dropdown-item" data-city="Agra">Agra</a></li>
          <li><a class="dropdown-item" data-city="Varanasi">Varanasi</a></li>
          <li><a class="dropdown-item" data-city="Lucknow">Lucknow</a></li>
          <li><a class="dropdown-item" data-city="Prayagraj">Prayagraj</a></li>
          <li><a class="dropdown-item" data-city="Gorakhpur">Gorakhpur</a></li>
        </ul>
      </div>

      <!-- Days Filter -->
      <div class="dropdown">
        <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
          Select Days
        </button>
        <ul class="dropdown-menu" id="dayFilter">
          <li><a class="dropdown-item" data-days="All">All</a></li>
          <li><a class="dropdown-item" data-days="1">1 Day</a></li>
          <li><a class="dropdown-item" data-days="3">3 Days</a></li>
          <li><a class="dropdown-item" data-days="5">5 Days</a></li>
        </ul>
      </div>

    </div>

    <!-- Cards Container (JS will render here) -->
    <div class="row g-4" id="cardContainer"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- External JS File -->
  <script src="script.js"></script>

</body>
</html>
